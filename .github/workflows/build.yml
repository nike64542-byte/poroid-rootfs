name: 构建系统镜像 (poroid-rootfs)

on:
  push:
    branches: [ main ]
    paths:
      - 'build-rootfs/**'
      - 'init-podroid'
      - 'Dockerfile.initramfs'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      distro:
        description: '构建哪个镜像'
        required: true
        default: 'kali'
        type: choice
        options:
          - initramfs
          - kali
          - debian
          - ubuntu
          - all
      system_version:
        description: '系统版本号 (SYSTEM_VERSION)'
        required: false
        default: '0'
        type: string
      push_to_release:
        description: '上传到 GitHub Release'
        required: false
        default: true
        type: boolean

env:
  DISTRO: ${{ github.event.inputs.distro || 'kali' }}
  SYSTEM_VERSION: ${{ github.event.inputs.system_version || '0' }}

jobs:
  build-rootfs:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null || true
          df -h

      - name: 设置 QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建目标镜像
        run: |
          echo "DISTRO=${DISTRO} SYSTEM_VERSION=${SYSTEM_VERSION}"
          case "${DISTRO}" in
            initramfs) ./build.sh initramfs ;;
            kali)      ./build.sh initramfs && ./build.sh kali ;;
            debian)    ./build.sh initramfs && ./build.sh debian ;;
            ubuntu)    ./build.sh initramfs && ./build.sh ubuntu ;;
            all)
              ./build.sh initramfs
              ./build.sh kali
              ./build.sh debian
              ./build.sh ubuntu
              ;;
            *) echo "未知 distro: ${DISTRO}"; exit 1 ;;
          esac

      - name: 清理 Docker 镜像
        run: |
          docker rmi -f podroid-rootfs-kali podroid-rootfs-debian podroid-rootfs-ubuntu podroid-initramfs-builder 2>/dev/null || true
          docker system prune -f 2>/dev/null || true
          df -h /

      - name: 上传系统镜像产物
        uses: actions/upload-artifact@v4
        with:
          name: podroid-system-${{ env.DISTRO }}
          path: |
            out/initrd.img
            out/*-rootfs.squashfs
          if-no-files-found: error
          retention-days: 30

      - name: 上传到 Release
        if: inputs.push_to_release != false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "最新系统镜像" --notes "System $SYSTEM_VERSION ($DISTRO)" --prerelease
          # 只上传本次构建的产物，用 --clobber 覆盖同名旧文件
          for f in out/initrd.img out/*-rootfs.squashfs; do
            [ -f "$f" ] && gh release upload latest "$f" --clobber || true
          done
